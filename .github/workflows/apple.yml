name: apple
# Public repo since 2026-10-12: standard runners, macOS included, are free.

# platform/apps/apple (Cardsite for iPhone, iPad and Mac) and the StudioKit
# package it depends on. macOS runners only, except the fixture check, the
# design lint and the screens publish.
#
# What a green run proves: CardsiteKit's unit tests pass against fixtures
# captured from a live API; CardsiteKit builds for watchOS; the app compiles
# for the iOS Simulator (with its embedded watch app), macOS and the visionOS
# Simulator, and the watch app on its own, with signing off; and the UI tests (screenshots + journeys) pass
# against the in-app fixture server on iPhone, iPad and Mac. It does not
# prove the app works against the real API on a device; see
# docs/launch/native-apple.md → Verification for the device checks.
#
# Compiler errors are turned into check-run annotations
# (CardsiteUITests/ci/annotate-errors.py), so a failure is readable without
# the raw log. Screenshots land on the orphan `screens` branch under
# runs/<sha>/ (see CardsiteUITests/README.md).

on:
  push:
    branches: [main, "claude/**", "ws/**"]
    paths:
      - "platform/apps/apple/**"
      - "platform/studio/packages/swift/**"
      - ".github/workflows/apple.yml"
  pull_request:
    paths:
      - "platform/apps/apple/**"
      - "platform/studio/packages/swift/**"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: platform/apps/apple

env:
  ANNOTATE: CardsiteUITests/ci/annotate-errors.py

jobs:
  fixtures:
    name: contract fixtures in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/sync-fixtures.sh --check

  lint:
    name: design lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/lint-design.sh
        run: |
          for script in scripts/lint-design.sh ../../../scripts/lint-design.sh; do
            if [ -f "$script" ]; then
              echo "running $script"
              bash "$script"
              exit $?
            fi
          done
          echo "::notice title=design lint::scripts/lint-design.sh does not exist yet; nothing to lint"

  kit:
    name: CardsiteKit + StudioKit (swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild -version && swift --version
          echo "::notice title=toolchain::$(xcodebuild -version | tr '\n' ' ') / $(xcrun --show-sdk-version --sdk iphoneos 2>/dev/null) iOS SDK / $(swift --version 2>&1 | head -1)"
      - name: swift test (CardsiteKit)
        run: |
          set -o pipefail
          swift test --package-path Packages/CardsiteKit 2>&1 | tee kit.log \
            || { python3 "$ANNOTATE" kit.log; exit 1; }
      - name: swift test (StudioKit)
        run: |
          set -o pipefail
          swift test --package-path ../../studio/packages/swift 2>&1 | tee studio.log \
            || { python3 "$ANNOTATE" studio.log; exit 1; }
      - name: watchOS platform
        run: xcodebuild -showsdks | grep -q -- "-sdk watchsimulator" || xcodebuild -downloadPlatform watchOS
      # The watch app links CardsiteKit, so every kit source must build
      # without UIKit, CoreImage or WatchConnectivity's iOS-only API.
      - name: build CardsiteKit (watchOS)
        working-directory: platform/apps/apple/Packages/CardsiteKit
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme CardsiteKit \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../kit-watch.log \
            || { python3 "../../$ANNOTATE" ../../kit-watch.log; exit 1; }

  app:
    name: app builds (${{ matrix.destination.name }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `platforms`: the Xcode platforms the build needs beyond iOS and
        # macOS. The iOS app embeds the watch app, so it needs watchOS.
        destination:
          - { name: iOS Simulator, value: "generic/platform=iOS Simulator", scheme: Cardsite, platforms: "watchOS" }
          - { name: macOS, value: "generic/platform=macOS", scheme: Cardsite, platforms: "" }
          - { name: visionOS Simulator, value: "generic/platform=visionOS Simulator", scheme: Cardsite, platforms: "visionOS" }
          - { name: watchOS Simulator, value: "generic/platform=watchOS Simulator", scheme: CardsiteWatch, platforms: "watchOS" }
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: download missing platforms
        if: matrix.destination.platforms != ''
        run: |
          for platform in ${{ matrix.destination.platforms }}; do
            case "$platform" in
              watchOS) sdk=watchsimulator ;;
              visionOS) sdk=xrsimulator ;;
              *) sdk="" ;;
            esac
            if [ -n "$sdk" ] && xcodebuild -showsdks | grep -q -- "-sdk $sdk"; then
              echo "$platform is installed"
            else
              xcodebuild -downloadPlatform "$platform"
            fi
          done
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: xcodebuild
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cardsite.xcodeproj \
            -scheme "${{ matrix.destination.scheme }}" \
            -configuration Debug \
            -destination "${{ matrix.destination.value }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log \
            || { python3 "$ANNOTATE" build.log; exit 1; }
          echo "warnings: $(grep -c ' warning: ' build.log || true)"

  # Screenshot matrix + journeys: CardsiteUITests on the in-app fixture
  # server (-CardsiteFixtures), light / dark / AX XXXL on each device.
  screens:
    name: screens (${{ matrix.device.name }})
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: iPhone, slug: iphone, platform: iOS, prefer: "iPhone 17 Pro Max", match: "^iPhone .*Pro Max$" }
          - { name: iPad, slug: ipad, platform: iOS, prefer: "iPad Pro 13-inch (M5)", match: "^iPad Pro .*13" }
          - { name: Mac, slug: mac, platform: macOS, prefer: "", match: "" }
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      # The iOS app embeds the watch app, so its build needs watchOS.
      - name: watchOS platform
        if: matrix.device.platform == 'iOS'
        run: xcodebuild -showsdks | grep -q -- "-sdk watchsimulator" || xcodebuild -downloadPlatform watchOS
      - run: brew install xcodegen
      - run: xcodegen generate

      - name: pick and boot the simulator
        if: matrix.device.platform == 'iOS'
        run: |
          python3 CardsiteUITests/ci/pick-simulator.py "${{ matrix.device.prefer }}" "${{ matrix.device.match }}" > sim.env \
            || { xcrun simctl list devices available; exit 1; }
          cat sim.env
          udid=$(sed -n 's/^udid=//p' sim.env)
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # App Store-style status bar.
          xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
          echo "SIGNING=CODE_SIGNING_ALLOWED=NO" >> "$GITHUB_ENV"

      - name: macOS destination and ad hoc signing
        if: matrix.device.platform == 'macOS'
        run: |
          echo "DESTINATION=platform=macOS,arch=arm64" >> "$GITHUB_ENV"
          # Ad hoc, no team; CI-macOS.entitlements drops keychain-access-groups,
          # which macOS won't launch without a provisioning profile.
          echo "SIGNING=CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_ENTITLEMENTS=$GITHUB_WORKSPACE/platform/apps/apple/CardsiteUITests/Support/CI-macOS.entitlements ENABLE_HARDENED_RUNTIME=NO" >> "$GITHUB_ENV"

      - name: build for testing
        run: |
          set -o pipefail
          # $SIGNING is deliberately unquoted: it holds several settings.
          xcodebuild build-for-testing \
            -project Cardsite.xcodeproj \
            -scheme Cardsite \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            $SIGNING \
            2>&1 | tee build.log \
            || { python3 "$ANNOTATE" build.log; exit 1; }

      - name: Mac launch diagnosis
        if: matrix.device.slug == 'mac'
        run: |
          D="screens/mac/failures"; mkdir -p "$D"
          APP=$(find DerivedData/Build/Products -maxdepth 2 -name "Cardsite.app" -type d | head -n 1)
          echo "app: $APP" > "$D/launch-diagnosis.txt"
          if [ -n "$APP" ]; then
            # Launch variants isolate what keeps the window away. Each result
            # is also a check-run annotation, readable before the run ends.
            n=0
            while IFS= read -r args; do
              n=$((n+1))
              "$APP/Contents/MacOS/Cardsite" $args > "$D/launch-$n-stdout.txt" 2>&1 &
              PID=$!
              sleep 12
              W=$(osascript -e 'tell application "System Events" to get name of every window of (first process whose unix id is '"$PID"')' 2>&1 | tr '\n' ' ')
              echo "launch $n [$args] windows: $W" >> "$D/launch-diagnosis.txt"
              echo "::warning title=mac launch $n::[$args] windows: $W"
              screencapture -x "$D/launch-$n-screen.png" || true
              [ $n -eq 1 ] && { sample $PID 3 -file "$D/launch-sample.txt" >/dev/null 2>&1 || true; }
              kill $PID 2>/dev/null || true
              sleep 2
            done <<'VARIANTS'
          -CardsiteFixtures
          -CardsiteFixtures YES
          -CardsiteFixturesEmpty -CardsiteFixtures
          -CardsiteFixtures -CardsiteFixturesEmpty
          -CardsiteFixturesSignedOut
          -NSQuitAlwaysKeepsWindows NO
          VARIANTS
          fi
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i cardsite | head -n 3 | while read f; do
            cp "$HOME/Library/Logs/DiagnosticReports/$f" "$D/crash-$f.txt"; done
          log show --last 3m --style compact --predicate 'process == "Cardsite"' 2>/dev/null | tail -n 300 > "$D/launch-log.txt" || true

      - name: UI tests (screenshots + journeys)
        id: tests
        continue-on-error: true
        # Caps a stuck run so the screenshots still get published.
        timeout-minutes: 60
        run: |
          set -o pipefail
          rm -rf screens.xcresult
          # Watchdog: the iPhone page editor left the app's main thread
          # "busy" for XCTest without using CPU, so sample on a clock and
          # keep only samples whose main thread isn't idle in its run loop.
          D="screens/${{ matrix.device.slug }}/failures"; mkdir -p "$D" "$D/samples"
          ( i=0; while true; do sleep 30
              PID=$(pgrep -f "Cardsite.app/Cardsite" | head -n 1)
              [ -n "$PID" ] || continue
              i=$((i+1)); sample "$PID" 1 -file "$D/samples/s-$i.txt" >/dev/null 2>&1 || true
            done ) &
          WATCHDOG=$!
          trap 'kill $WATCHDOG 2>/dev/null || true' EXIT
          xcodebuild test-without-building \
            -project Cardsite.xcodeproj \
            -scheme Cardsite \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:CardsiteUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 900 \
            -resultBundlePath screens.xcresult \
            $SIGNING \
            2>&1 | tee test.log

      # The iPhone page editor left the main thread "busy" for XCTest's
      # accessibility snapshots, yet sat idle when opened directly. Run the
      # snapshot probe alone and sample the app while it waits.
      - name: page editor diagnosis (iPhone)
        if: always() && matrix.device.slug == 'iphone'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          D="screens/iphone/failures"; mkdir -p "$D"
          ( sleep 25; for n in 1 2 3 4; do
              PID=$(pgrep -f "Cardsite.app/Cardsite" | head -n 1)
              echo "t=$n pid=$PID $(ps -o %cpu=,etime= -p "$PID" 2>/dev/null)" >> "$D/editor-diagnosis.txt"
              [ -n "$PID" ] && sample "$PID" 3 -file "$D/editor-sample-$n.txt" >/dev/null 2>&1
              sleep 7
            done ) &
          SAMPLER=$!
          TEST_RUNNER_CARDSITE_DIAG=1 xcodebuild test-without-building \
            -project Cardsite.xcodeproj -scheme Cardsite -configuration Debug \
            -destination "$DESTINATION" -derivedDataPath DerivedData \
            -only-testing:CardsiteUITests/DiagnosticsTests \
            -resultBundlePath diag.xcresult $SIGNING 2>&1 | grep -E "Test Case|error|took" | tail -n 20 >> "$D/editor-diagnosis.txt" || true
          wait $SAMPLER || true
          xcrun xcresulttool export attachments --path diag.xcresult --output-path diag-att >/dev/null 2>&1 \
            && find diag-att -name "*.txt" -exec cp {} "$D/" \; || true

      - name: keep busy samples
        if: always() && matrix.device.platform == 'iOS'
        continue-on-error: true
        run: |
          D="screens/${{ matrix.device.slug }}/failures"
          python3 - "$D" <<'PY'
          import os, re, sys
          d = sys.argv[1]; src = os.path.join(d, "samples"); kept = 0
          for name in sorted(os.listdir(src) if os.path.isdir(src) else []):
              text = open(os.path.join(src, name), errors="replace").read()
              main = text.split("Thread_", 2)
              block = main[1] if len(main) > 1 else ""
              total = re.search(r"\+ (\d+) start", block)
              idle = re.search(r"(\d+) __CFRunLoopServiceMachPort", block)
              if total and (not idle or int(idle.group(1)) < 0.9 * int(total.group(1))) and kept < 4:
                  kept += 1
                  os.rename(os.path.join(src, name), os.path.join(d, "busy-" + name))
          for name in os.listdir(src) if os.path.isdir(src) else []:
              os.remove(os.path.join(src, name))
          if os.path.isdir(src): os.rmdir(src)
          print("kept", kept)
          PY

      - name: export screenshots
        if: always()
        run: python3 CardsiteUITests/ci/export-screens.py screens.xcresult "screens/${{ matrix.device.slug }}"

      # The session can read the screens branch but not job logs, so the
      # test log tail and (on the Mac) a launch diagnosis go there too.
      - name: logs to the screens branch
        if: always()
        run: |
          mkdir -p "screens/${{ matrix.device.slug }}/failures"
          if [ -f test.log ]; then
            grep -E "error|failed|Test Case|Assertion|crash|Fatal|fixture|Cardsite\[" test.log | tail -n 400 \
              > "screens/${{ matrix.device.slug }}/failures/test-log-tail.txt" || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.device.slug }}
          path: platform/apps/apple/screens/${{ matrix.device.slug }}
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.device.slug }}
          path: |
            platform/apps/apple/build.log
            platform/apps/apple/test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: fail on test failures
        if: steps.tests.outcome == 'failure'
        run: |
          python3 "$ANNOTATE" test.log
          grep -E "Test Case .* (failed|passed)" test.log | tail -n 60 || true
          exit 1

  # Commits every device's PNGs to the orphan `screens` branch, under
  # runs/<sha>/, with an index.md. The session reads that branch with git;
  # it can't download artifacts through its proxy.
  screens-publish:
    name: publish screens
    needs: [screens]
    if: >-
      always() && needs.screens.result != 'skipped' && needs.screens.result != 'cancelled' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: apple-screens-publish
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: platform/apps/apple/CardsiteUITests/ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: screens-*
          path: screens
      - name: rename artifact folders to device slugs
        run: |
          shopt -s nullglob
          for dir in screens/screens-*; do mv "$dir" "screens/${dir#screens/screens-}"; done
          ls -R screens | head -n 200
      - name: commit to the screens branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RUNS: "2"
        run: python3 platform/apps/apple/CardsiteUITests/ci/publish-screens.py screens

  apple-summary:
    needs: [fixtures, lint, kit, app, screens, screens-publish]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - run: |
          echo "fixtures: ${{ needs.fixtures.result }}  lint: ${{ needs.lint.result }}  kit: ${{ needs.kit.result }}  app: ${{ needs.app.result }}"
          echo "screens: ${{ needs.screens.result }}  publish: ${{ needs.screens-publish.result }}"
          for r in "${{ needs.fixtures.result }}" "${{ needs.lint.result }}" "${{ needs.kit.result }}" "${{ needs.app.result }}" "${{ needs.screens.result }}"; do
            [ "$r" = "success" ] || exit 1
          done
          # Publishing is skipped on fork PRs (read-only token); that is not a failure.
          case "${{ needs.screens-publish.result }}" in success|skipped) ;; *) exit 1 ;; esac
